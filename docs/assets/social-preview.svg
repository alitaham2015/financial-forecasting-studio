<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Financial Forecasting Studio</title>
  <desc id="description">Private financial scenarios, daily cash feasibility, and net present value.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101e34" />
      <stop offset="1" stop-color="#203b66" />
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70a0ff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#70a0ff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#07101e" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <circle cx="1150" cy="-40" r="300" fill="#3567e9" opacity="0.16" />
  <circle cx="84" cy="690" r="250" fill="#31ad8c" opacity="0.10" />

  <g transform="translate(72 74)">
    <rect width="58" height="58" rx="15" fill="#3871f3" />
    <path d="M17 43V15h27M17 29h20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />
    <text x="78" y="21" fill="#9fb5d5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">LOCAL-FIRST PLANNING</text>
    <text x="78" y="52" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">Forecasting Studio</text>
  </g>

  <g transform="translate(72 205)">
    <text fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">
      <tspan x="0" y="0">See whether a plan</tspan>
      <tspan x="0" y="69">works on every date.</tspan>
    </text>
    <text x="0" y="166" fill="#b7c7dc" font-family="Segoe UI, Arial, sans-serif" font-size="23">
      Daily cash feasibility and NPV in one private scenario.
    </text>

    <g transform="translate(0 222)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
      <rect width="156" height="42" rx="21" fill="#ffffff" opacity="0.10" />
      <text x="78" y="27" fill="#e8eff9" text-anchor="middle">Exact decimals</text>
      <rect x="170" width="128" height="42" rx="21" fill="#ffffff" opacity="0.10" />
      <text x="234" y="27" fill="#e8eff9" text-anchor="middle">Local SQLite</text>
      <rect x="312" width="126" height="42" rx="21" fill="#ffffff" opacity="0.10" />
      <text x="375" y="27" fill="#e8eff9" text-anchor="middle">87 tests</text>
    </g>
  </g>

  <g transform="translate(768 86)" filter="url(#shadow)">
    <rect width="438" height="468" rx="24" fill="#f8faff" />
    <text x="34" y="48" fill="#77869d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SCENARIO OVERVIEW</text>

    <g transform="translate(30 76)" font-family="Segoe UI, Arial, sans-serif">
      <rect width="180" height="102" rx="14" fill="#ffffff" stroke="#e3e9f2" />
      <text x="18" y="27" fill="#718099" font-size="12">Cash feasibility</text>
      <text x="18" y="61" fill="#14816d" font-size="23" font-weight="700">Cash-feasible</text>
      <text x="18" y="83" fill="#8b96a8" font-size="11">Every closing balance ≥ 0</text>

      <rect x="196" width="180" height="102" rx="14" fill="#ffffff" stroke="#e3e9f2" />
      <text x="214" y="27" fill="#718099" font-size="12">Net present value</text>
      <text x="214" y="61" fill="#1a2944" font-size="23" font-weight="700">+$13,561.30</text>
      <text x="214" y="83" fill="#8b96a8" font-size="11">Opening cash excluded</text>
    </g>

    <g transform="translate(30 208)">
      <text x="0" y="0" fill="#51627e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">Cash through time</text>
      <line x1="0" x2="376" y1="170" y2="170" stroke="#dde5f0" />
      <line x1="0" x2="376" y1="114" y2="114" stroke="#e9eef5" stroke-dasharray="4 5" />
      <line x1="0" x2="376" y1="58" y2="58" stroke="#e9eef5" stroke-dasharray="4 5" />
      <path d="M0 150 L26 136 L56 151 L86 121 L118 140 L148 105 L180 132 L212 97 L244 116 L276 79 L308 101 L338 65 L376 24 L376 170 L0 170 Z" fill="url(#chartFill)" />
      <path d="M0 150 L26 136 L56 151 L86 121 L118 140 L148 105 L180 132 L212 97 L244 116 L276 79 L308 101 L338 65 L376 24" fill="none" stroke="#3567e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="376" cy="24" r="6" fill="#3567e9" />
    </g>

    <g transform="translate(30 420)" font-family="Segoe UI, Arial, sans-serif">
      <circle cx="6" cy="6" r="6" fill="#31ad8c" />
      <text x="22" y="11" fill="#61718b" font-size="12">Runs locally · no external connections</text>
    </g>
  </g>
</svg>
